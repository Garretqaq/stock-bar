# Windows 打包：推 v* 标签自动构建并发布到 GitHub Release（草稿），
# 也可在 Actions 页面手动触发（只上传构建产物，不发 Release）。
name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本取 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # 打标签：构建 MSI + NSIS 安装包并创建 Release 草稿
      - name: 构建并发布
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: StockBar ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      # 手动触发：只构建，产物上传到本次运行的 Artifacts
      - name: 构建
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm app:build

      - name: 上传安装包
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: StockBar-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
