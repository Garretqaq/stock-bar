[package]
name = "stock-bar"
version = "0.0.6"
description = "菜单栏盯盘小工具（东方财富行情）"
edition = "2021"

[lib]
name = "stock_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
# MCP 本地桥用的极简 HTTP 服务（只监听回环，见 src/bridge.rs）
tiny_http = "0.12"
# 桥的令牌：用系统随机源，别自己拼（本来就在依赖树里）
getrandom = "0.3"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.56"
