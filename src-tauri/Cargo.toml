[package]
name = "stock-bar"
version = "0.0.21"
description = "菜单栏盯盘小工具（东方财富行情）"
edition = "2021"

[lib]
name = "stock_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
# MCP 本地桥用的极简 HTTP 服务（只监听回环，见 src/bridge.rs）
tiny_http = "0.12"
# 桥的令牌：用系统随机源，别自己拼（本来就在依赖树里）
getrandom = "0.3"
tauri-plugin-updater = "2"
# 系统通知（提醒触发时发一条）：Windows 走 Toast（这个插件）；macOS 另走 UNUserNotificationCenter，
# 见下面的 macOS 依赖与 src/notify.rs
tauri-plugin-notification = "2"
# 腾讯板块排行的取数：那条接口不返回 CORS 头，webview 里 fetch 读不到，改由 Rust 侧取
# （见 src/qqrank.rs）。与 tauri-plugin-updater 用同一份 reqwest，features 对齐 ——
# 别引入第二套 TLS 后端（rustls 的 provider 由插件那侧打开 ring 提供）
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# rustls 的加密后端：上面的 reqwest 用 rustls-no-provider，不装 provider 就建不出 Client
# （tauri-plugin-updater 也是这么做的，见其 updater.rs；两边都装一次是安全的）
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# WebDAV 密码的本地加密：AES-256-GCM 直接用 ring 的 AEAD —— 它本来就在依赖树里
# （见 src/backup.rs），不为一个对称加密再拉一个 crate 进来
ring = "0.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.56"

# macOS 的通知：插件那条路走的是废弃的 NSUserNotificationCenter，在 macOS 26 上只入历史、
# 不弹横幅（详见 src/notify.rs 的模块注释），所以自己用 UserNotifications 框架发。
# 这几个 crate 本来就在 tauri 的依赖树里，不新增下载。
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
